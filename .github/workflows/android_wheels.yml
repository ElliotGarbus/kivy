name: Android wheels

on:
  push:
  pull_request:
  create:
  schedule:
    - cron:  '23 1 * * *'
  workflow_dispatch:

env:
  KIVY_SPLIT_EXAMPLES: 1
  SERVER_IP: '159.203.106.198'
  # Forge-aligned NDK (16KB page size era)
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  android_wheels_create:
    name: Build Android wheels
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build wheel]') || contains(github.event.head_commit.message, '[build wheel android]') || contains(github.event.pull_request.title, '[build wheel]') || contains(github.event.pull_request.title, '[build wheel android]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install CI/CD Python requirements
        run: |
          python -m pip install -r .ci/cicd-requirements.txt
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android NDK and platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platforms;android-24" "build-tools;35.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Host prep for Android CPython subprocess shell
        # cibuildwheel's Android interpreter reports getandroidapilevel, so
        # subprocess(shell=True) looks for /system/bin/sh on the Linux host.
        run: |
          sudo mkdir -p /system/bin
          sudo ln -sfn /bin/sh /system/bin/sh
      - uses: actions/cache@v5
        id: cacheandroiddeps
        with:
          path: android-kivy-dependencies
          key: android-deps-${{ runner.os }}-${{ hashFiles('tools/build_android_dependencies.sh') }}
      - name: Build Android dependencies (official SDL3 devel AARs)
        if: steps.cacheandroiddeps.outputs.cache-hit != 'true'
        run: |
          chmod +x ./tools/build_android_dependencies.sh
          ./tools/build_android_dependencies.sh
      - name: Build Android wheels
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS: "arm64_v8a x86_64"
          # At least cp314 for kivyforge; include other supported CPythons.
          CIBW_BUILD: "cp311-android* cp312-android* cp313-android* cp314-android*"
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD_VERBOSITY: 1
          # Copy-only repair: do not rewrite SDL sonames (kivyforge load model).
          CIBW_REPAIR_WHEEL_COMMAND: "cp {wheel} {dest_dir}/"
        run: |
          export KIVY_DEPS_ROOT="$(pwd)/android-kivy-dependencies"
          # Pass cross-build vars into cibuildwheel's Android build env explicitly.
          export CIBW_ENVIRONMENT_ANDROID="KIVY_CROSS_PLATFORM=android USE_SDL3=1 ANDROID_API_LEVEL=24 KIVY_SPLIT_EXAMPLES=1 KIVY_DEPS_ROOT=${KIVY_DEPS_ROOT}"
          python -m cibuildwheel --output-dir wheelhouse
      - name: Bundle SDL3 shared libraries into wheel .libs/
        env:
          KIVY_DEPS_ROOT: ${{ github.workspace }}/android-kivy-dependencies
        run: |
          python ./tools/add-android-libs.py ./wheelhouse
      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7
        with:
          name: android_wheels
          path: wheelhouse/*.whl
      - name: Upload Android SDL3 deps as artifact
        uses: actions/upload-artifact@v7
        with:
          name: android_sdl3_deps
          path: |
            android-kivy-dependencies/dist/libs/**
            android-kivy-dependencies/dist/include/**

  android_wheel_upload:
    runs-on: ubuntu-latest
    needs: android_wheels_create
    # Only the upstream Kivy repo publishes; forks keep GitHub artifacts.
    if: github.repository == 'kivy/kivy' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: |
          python -m pip install -r .ci/cicd-requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: android_wheels
          path: dist
      - name: Rename wheels
        if: github.event.ref_type != 'tag'
        run: |
          source .ci/ubuntu_ci.sh
          rename_wheels
      - name: Upload wheels to server
        env:
          UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        run: |
          source .ci/ubuntu_ci.sh
          upload_file_to_server "$SERVER_IP" "android/kivy/"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: true
      - name: Publish to PyPI
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.pypi_password }}
        run: |
          twine upload dist/*